name: Repository bug report
description: Report a broken link, template issue, formatting problem, or incorrect repository metadata.
title: "[Repo]: "
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Broken link or missing file
        - Template or contribution flow problem
        - README or navigation issue
        - Release note or metadata issue
        - Other repository bug
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Affected file or page
      placeholder: README.md, docs/submission-template.md, .github/pull_request_template.md
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: What happened
      placeholder: Describe the broken behavior or incorrect content.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What you expected
      placeholder: Describe what should happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or verification steps
      description: Keep this short. Link checks, page paths, or markdown rendering notes are enough.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested fix
      description: Optional, but useful if you already know the likely correction.
      placeholder: Share a likely fix or a pointer to the correct source.

  - type: checkboxes
    id: checks
    attributes:
      label: Report checks
      options:
        - label: I checked that this is a repository issue rather than a third-party product issue.
          required: true
        - label: I avoided posting secrets or sensitive internal information.
          required: true
